# ------------------------------------------------------------------
# fun.limited : site settings
#
# GitHub reads this file every time it rebuilds the site.
# Lines starting with # are notes to you and are ignored.
# ------------------------------------------------------------------

title: fun.limited
lang: en-CA
timezone: America/Vancouver

# Contact address shown in the footer.
email: ReleveApps@Fun.Limited

# The one-sentence description of the practice, settled 11 September 2026.
# It is the sentence on the home page, and it is also what search results
# and link previews show, which is why it is set here rather than only in
# the page. Setting it also stops GitHub borrowing the repository's own
# description.
description: "Tools, methods and evidence for measuring the environment properly."

# While this says true, every page asks search engines not to list it.
# Change it to false on launch day, when fun.limited points here.
preview: true

# Turns off GitHub's built-in "Primer" theme. Without this line GitHub
# quietly adds its own stylesheet at the same address as ours.
theme: null

# The site's web address is left out on purpose while the site is in
# preview: GitHub fills in the github.io address itself. At launch, add
#   url: "https://fun.limited"
# (spelled exactly as the domain you connect) when you set preview to false.

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag    # page titles and link previews (LinkedIn, email)
  - jekyll-sitemap    # a list of pages for search engines

# The three kinds of entry. Each file in _studies, _guides or _apps
# becomes its own page, at the address shown, and is laid out by the
# matching template in _layouts (study, guide or app).
collections:
  studies:
    output: true
    permalink: /research/:name/
  guides:
    output: true
    permalink: /guides/:name/
  apps:
    output: true
    permalink: /apps/:name/

exclude:
  - README.md
  - CNAME
  # The site now lives in C:\Users\spber\OneDrive\fun.limited\website
  # and working files sit beside it in fun.limited, outside what gets
  # uploaded. This line is only a safety net in case a downloads folder
  # ever lands inside website. Excluding a folder keeps it off the built
  # site; it does NOT remove it from the public repository.
  - "Claude outputs"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: studies
    values:
      layout: study
      section: research
  - scope:
      path: ""
      type: guides
    values:
      layout: guide
      section: guides
  - scope:
      path: ""
      type: apps
    values:
      layout: app
      section: apps
