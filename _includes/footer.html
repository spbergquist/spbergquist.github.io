<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__contact"><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p class="site-footer__legal">{% if page.updated %}<span>Last updated <time datetime="{{ page.updated | date: '%Y-%m-%d' }}">{{ page.updated | date: "%-d %B %Y" }}</time></span> · {% endif %}<span>&copy; {{ site.time | date: "%Y" }} fun.limited</span></p>
  </div>
</footer>
